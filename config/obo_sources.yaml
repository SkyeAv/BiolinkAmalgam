# OBO ontologies ingested with `--obo <dir>` (files fetched by scripts/fetch-obo.sh).
# Every entry was checked on 2026-10-26 against:
#   - Biolink Model 4.4.6 class id_prefixes (biolink-model.yaml): the category is the
#     Biolink class that lists this prefix. Ontologies whose prefix maps to several
#     unrelated classes are excluded rather than forced into one.
#   - OBO Foundry registry (obofoundry.org/registry/ontologies.yml): license, active
#     status, and the .obo product PURL.
# Only active own-prefix terms with names, EXACT synonyms and alt_ids become cliques.
# Generic xrefs and replaced_by are exported as typed edges in crossrefs.parquet, never
# as equivalence. taxa puts species-specific ontologies into their own taxon scope so
# e.g. mouse and zebrafish "abnormal heart" terms do not arbitrate against each other.
# Taxa must be in taxa.yaml taxon_allowlist or the allowlist filter drops the terms.
ontologies:
  - prefix: MP # mammalian (mouse) phenotypes; Biolink: phenotypic feature (also disease)
    url: https://purl.obolibrary.org/obo/mp.obo
    category: biolink:PhenotypicFeature
    license: CC-BY-4.0
    taxa: [NCBITaxon:10090]
  - prefix: ZP # zebrafish phenotypes
    url: https://purl.obolibrary.org/obo/zp.obo
    category: biolink:PhenotypicFeature
    license: CC-BY-3.0
    taxa: [NCBITaxon:7955]
  - prefix: FYPO # fission yeast phenotypes
    url: https://purl.obolibrary.org/obo/fypo.obo
    category: biolink:PhenotypicFeature
    license: CC-BY-4.0
    taxa: [NCBITaxon:4896]
  - prefix: WBPhenotype # C. elegans phenotypes
    url: https://purl.obolibrary.org/obo/wbphenotype.obo
    category: biolink:PhenotypicFeature
    license: CC-BY-4.0
    taxa: [NCBITaxon:6239]
  - prefix: APO # ascomycete (yeast) phenotypes, multi-species
    url: https://purl.obolibrary.org/obo/apo.obo
    category: biolink:PhenotypicFeature
    license: CC-BY-4.0
    taxa: []
  - prefix: TO # plant traits, multi-species
    url: https://purl.obolibrary.org/obo/to.obo
    category: biolink:PhenotypicFeature
    license: CC-BY-4.0
    taxa: []
  - prefix: MAXO # medical actions; Biolink: procedure
    url: https://purl.obolibrary.org/obo/maxo.obo
    category: biolink:Procedure
    license: CC-BY-4.0
    taxa: []
  - prefix: HsapDv # human developmental stages
    url: https://purl.obolibrary.org/obo/hsapdv.obo
    category: biolink:LifeStage
    license: CC-BY-3.0
    taxa: [NCBITaxon:9606]
  - prefix: MmusDv # mouse developmental stages
    url: https://purl.obolibrary.org/obo/mmusdv.obo
    category: biolink:LifeStage
    license: CC-BY-3.0
    taxa: [NCBITaxon:10090]
  - prefix: ZFS # zebrafish stages
    url: https://purl.obolibrary.org/obo/zfs.obo
    category: biolink:LifeStage
    license: CC-BY-3.0
    taxa: [NCBITaxon:7955]
  - prefix: FBdv # Drosophila developmental stages
    url: https://purl.obolibrary.org/obo/fbdv.obo
    category: biolink:LifeStage
    license: CC-BY-4.0
    taxa: [NCBITaxon:7227]
  - prefix: WBls # C. elegans life stages
    url: https://purl.obolibrary.org/obo/wbls.obo
    category: biolink:LifeStage
    license: CC-BY-4.0
    taxa: [NCBITaxon:6239]
  - prefix: MOD # PSI-MOD protein modifications; Biolink: posttranslational modification
    url: https://purl.obolibrary.org/obo/mod.obo
    category: biolink:PosttranslationalModification
    license: CC-BY-4.0
    taxa: []
  - prefix: TAXRANK # taxonomic ranks
    url: https://purl.obolibrary.org/obo/taxrank.obo
    category: biolink:TaxonomicRank
    license: CC0-1.0
    taxa: []
  - prefix: FAO # fungal gross anatomy
    url: https://purl.obolibrary.org/obo/fao.obo
    category: biolink:GrossAnatomicalStructure
    license: CC0-1.0
    taxa: []
# Excluded, with reasons (keep current):
#   XPO      - Xenopus taxon 8355 is not in the current allowlist; do not hide its species as taxonless.
#   GENO     - Biolink maps the prefix only to "genetic inheritance"; most terms are not that.
#   PO, FBcv - one prefix spans several Biolink classes (structures + stages / mixed CVs).
#   UPHENO   - no .obo product in the OBO Foundry registry.
#   UNIMOD   - not in the OBO Foundry registry; license not verified.
#   HANCESTRO, EDAM, FOODON - no current OBO release at the PURL.
#   GO, CL, UBERON, HP, MONDO, ... - already present in BABEL.
#   full dbSNP (b157, 28G VCF, ~1.2B rsIDs) - deferred; --clinvar covers ClinVar-cited rsIDs.
