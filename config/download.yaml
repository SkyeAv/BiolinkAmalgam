# Snapshot download settings. Loaded by Config.loadDownload; every key optional.
#
# Why one bulk aria2c invocation: BABEL snapshots are ~100 large files on a
# plain HTTPS index (stars.renci.org). Throughput is capped per connection by
# the server, so the only real lever is parallel range segments per file times
# concurrent files. aria2c does both in ONE process with native resume.
#
# Benchmark (2026-10-22, wenceslaus, 2.39GB compendia/Gene.txt.00, 16
# connections): aria2 42.6 MB/s, jdk-chunked 13.4 MB/s — aria2 is 3.2x faster,
# so it is the default and jdk-chunked exists only as the no-aria2 fallback
# path. Re-measure with `benchDownload` before changing the default.

# aria2 (default) or jdk (pure-JVM fallback for boxes without aria2c).
engine: aria2

base_url: https://stars.renci.org/var/babel_outputs

aria2:
  binary: aria2c
  # 16 is aria2's hard per-server maximum; more connections per file is the
  # main throughput win against per-connection throttling.
  connections_per_file: 16
  split: 16
  # Don't split small files into tiny segments (request overhead dominates).
  min_split_size: 16M
  # Concurrent files; with 16 connections each this is 128 sockets total.
  concurrent_files: 8
  # Passed through verbatim, e.g. ["--max-overall-download-limit=50M"].
  extra_args: []

# Concurrent files for the jdk engine (one connection per file).
jdk_concurrency: 8

# Snapshot files never downloaded (regex on the bare file name). Pure
# bandwidth/disk savings for content that filters.yaml drops anyway; the
# category filter remains the source of truth.
exclude_file_regex:
  # Publication.txt + its 5 split parts: 32GB of PMID/doi/PMC cliques that
  # drop_categories removes at ingest.
  - '^Publication\.txt'
