# Major NCBITaxon scopes for merge/arbitration bucketing.
# A taxon listed here gets its own (category, taxon) scope; every other taxon
# collapses into the shared "other-taxa" bucket so long-tail taxa don't multiply
# shuffle rows. Promote a taxon here when its cliques matter to you.
major_taxa:
  - NCBITaxon:9606   # Homo sapiens — dominant in every biomedical source
  - NCBITaxon:10090  # Mus musculus — primary model organism
  - NCBITaxon:10116  # Rattus norvegicus — common model organism
  - NCBITaxon:7955   # Danio rerio — zebrafish, common in gene sources
  - NCBITaxon:7227   # Drosophila melanogaster — common in gene sources
  - NCBITaxon:6239   # Caenorhabditis elegans — common in gene sources
  - NCBITaxon:4932   # Saccharomyces cerevisiae — common in gene sources
  - NCBITaxon:562    # Escherichia coli — common in protein sources

# Taxon allowlist — Tablassert fullmap parity (rust/src/fullmap.rs
# retain_for_taxon_allowlist): when non-empty, a clique whose valid taxa
# (positive NCBITaxon ids; NCBITaxon:0 and malformed values are not valid)
# are ALL outside this list is dropped at ingest. Taxonless cliques and
# biolink:OrganismTaxon cliques are always kept. Empty list disables.
#
# Same top-100 list as Tablassert's data/experimental_taxa.yaml, which was
# generated from in_taxon node frequencies in MultiomicsNext +
# MultiomicsHarness (descending frequency, ascending id on ties). Kept as
# NCBITaxon CURIEs to match BABEL row shapes.
taxon_allowlist:
