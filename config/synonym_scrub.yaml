# Review-only diagnostics. No threshold deletes names or changes the dataset.
# Dissimilar names may be valid abbreviations, translations or chemical names.
min_clique_members: 4 # Smaller cliques give too little contextual evidence.
max_clique_members: 64 # Bound quadratic comparisons per clique; larger cliques are skipped.
cohesion_floor: 0.22 # Low lexical cohesion is a review signal, not an error probability.
hub_cliques: 8 # Exact same-class recurrence may be legal across taxa; review only.
cross_enabled: true # Compare only outliers against exact stripped preferred-name keys.
cross_key_max_targets: 4 # Skip ambiguous target buckets before joining; no global fuzzy graph.
cross_similarity: 0.72 # Confirm trigram agreement after exact-key candidate generation.
cross_margin: 0.2 # Require more evidence than the alias's own-clique lexical similarity.
min_name_len: 4 # Short codes have insufficient trigrams; identifier aliases are protected too.
sample_examples: 200 # Bound the evidence sample written per signal.
