# Named resource profiles. `--profile local` applies these Spark settings;
# every value is overridable via CLI flags.
profiles:
  local:
    # This box: 16 CPUs / 20GB RAM worker. Leave 2 cores for OS + driver.
    spark.cores.max: "14"
    spark.executor.memory: "10g"
    spark.driver.memory: "4g"
    spark.sql.shuffle.partitions: "56"  # 4x cores
    spark.sql.adaptive.enabled: "true"
