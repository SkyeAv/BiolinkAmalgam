# Named resource profiles. `--profile <name>` applies these settings; `--master`
# on the CLI overrides the profile's master.
#
# Reserved keys (not passed to Spark as conf):
#   master: Spark master URL for this profile (local[N], spark://host:port,
#           k8s://..., yarn). Omitted => probe spark://127.0.0.1:7077, then
#           fall back to local[*].
# Every other key is passed verbatim as Spark conf. Cluster targeting is
# therefore pure YAML: add a profile with a master URL and executor sizing.
#
# NOTE: in local[*] mode the driver JVM IS the executor, so its heap must be
# set at JVM launch (JAVA_OPTS=-Xmx...); spark.driver.memory below documents
# the intended size but cannot resize an already-running JVM.
profiles:
  local:
    # Dev laptop: 16 CPUs / 20GB RAM worker. Leave 2 cores for OS + driver.
    spark.cores.max: "14"
    spark.executor.memory: "10g"
    spark.driver.memory: "4g"
    spark.sql.shuffle.partitions: "56"  # 4x cores
    spark.sql.adaptive.enabled: "true"

  wenceslaus:
    # Build box: 80 cores / 187GB RAM, single JVM (local mode). Full BABEL
    # runs OOM a 30GB laptop (120GB+ RSS), so they run here.
    master: "local[64]"
    spark.driver.memory: "140g"
    spark.sql.shuffle.partitions: "512"  # ~8x cores; AQE coalesces
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.files.maxPartitionBytes: "256m"
    spark.local.dir: "/home/sgoetz/spark-local-biolinkamalgam" # /home has 324G free; /local_raid1 runs at 98%
    spark.memory.fraction: "0.7"

  # Example remote standalone cluster (not used by default):
  # cluster:
  #   master: "spark://spark-master.example.org:7077"
  #   spark.executor.memory: "32g"
  #   spark.executor.cores: "8"
  #   spark.cores.max: "256"
  #   spark.sql.shuffle.partitions: "1024"

  wenceslaus-cluster:
    # Two-node standalone cluster (no sudo, fat jars only): master + 64-core
    # worker on wenceslaus, 36-core worker on hypatia. Per-node Spark scratch
    # via SPARK_LOCAL_DIRS at worker launch (conf spark.local.dir would be
    # cluster-wide). Data parity path: /users/sgoetz/biolinkamalgam/cache/2026jul22
    # exists on BOTH hosts (local disk on wenceslaus, NFS on hypatia) — rsync it
    # after every cache rebuild.
    master: "spark://wenceslaus:7077"
    spark.driver.memory: "140g"
    spark.driver.host: "wenceslaus"
    spark.driver.bindAddress: "0.0.0.0"
    spark.jars: "/users/sgoetz/biolinkamalgam/out.jar"
    spark.executor.memory: "70g"
    spark.executor.cores: "32"
    spark.cores.max: "96"
    spark.sql.shuffle.partitions: "512"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.memory.fraction: "0.7"
