# Identifier-namespace taxon inference (TaxonInference). Applied AFTER the ingest cache, so
# edits here never invalidate it; the taxa.yaml allowlist is re-applied afterwards.
#
# Why: BABEL leaves 269M cliques taxonless, and the fullmap-parity allowlist keeps every
# taxonless clique. Without inference, ~6.6M ENSEMBL gene/protein cliques from species
# outside the top-100 cutoff (958k pig ENSSSC alone) and MGI/RGD/ZFIN genes bypass it.
# Rule: a clique with NO valid taxa gets the union of the taxa its identifiers map to.
# Cliques that already carry taxa are never changed. Only namespaces that are
# single-species BY CONSTRUCTION appear here; multi-species spaces (UMLS, MESH, PR,
# UniProtKB, NCIT) stay taxonless even when BABEL evidence is mostly human.

# Whole CURIE prefix -> taxon. Evidence: BABEL 2026jul22 cliques with exactly one taxon.
prefix_taxa:
  MGI: NCBITaxon:10090       # Mouse Genome Informatics; 58,200/58,200 single-taxon cliques
  HGNC: NCBITaxon:9606       # HUGO human gene nomenclature; 44,236/44,236
  WormBase: NCBITaxon:6239   # C. elegans; 46,890/46,890
  FB: NCBITaxon:7227         # FlyBase D. melanogaster genes; 17,872/17,872
  SGD: NCBITaxon:559292      # Saccharomyces Genome Database (S288C); 6,471/6,471
  RGD: NCBITaxon:10116       # rat; BABEL reads the Alliance RGD file (rat only, src/datahandlers/mods.py)
  ZFIN: NCBITaxon:7955       # zebrafish; BABEL reads the Alliance ZFIN file (src/datahandlers/mods.py)

# Ensembl stable-id species prefix -> taxon. The prefix is the text between "ENS" and the
# feature letter (G/T/P/E/R/FM/GT + 11 digits); human uses the bare "ENS" prefix.
# Source per entry: BABEL 2026jul22 single-taxon evidence (always purity 1.0) when present,
# else Ensembl REST /lookup/id on one sample id (release 116) joined to /info/species.
# Disagreement: ENSGAC REST says 481459, BABEL evidence 69293 (allowlisted); BABEL wins
# because the allowlist is defined over BABEL taxa.
ensembl_species_prefixes:
