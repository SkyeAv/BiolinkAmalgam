# Scalafix lint rules, run via `make lint` (check) / `make fix` (apply).
rules = [
  OrganizeImports
  RemoveUnused
  DisableSyntax
  ProcedureSyntax
  RedundantSyntax
]

OrganizeImports {
  # RemoveUnused handles unused imports; avoid double-reporting.
  removeUnused = false
  groupedImports = Merge
}

RemoveUnused {
  imports = true
  privates = true
  locals = true
  # Spark/utest callbacks routinely take params they ignore.
  patternvars = false
  params = false
}

DisableSyntax {
  noReturns = false   # early returns read clearer in the I/O helpers
  noVars = false      # local vars in tight loops (NameKey.clean) are deliberate
  noNulls = false     # Spark rows and Java APIs speak null
  noXml = true
  noFinalize = true
  noValPatterns = true
}
